name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  server:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    services:
      mongo:
        image: mongo:7
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.runCommand({ ping: 1 })'"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      # Each test file creates and drops its own database on this server
      MONGO_URI: mongodb://127.0.0.1:27017
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: server/package-lock.json
      - run: npm ci
      - run: npm run build
      - run: npm test

  client:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: client
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: client/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build

  # One Playwright smoke test against the real app: built client served by the
  # server, MongoDB with the demo data
  e2e:
    runs-on: ubuntu-latest
    services:
      mongo:
        image: mongo:7
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.runCommand({ ping: 1 })'"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: |
            client/package-lock.json
            server/package-lock.json
      - run: npm ci && npm run build
        working-directory: client
      - run: npm ci && npm run build
        working-directory: server
      - run: npx playwright install --with-deps chromium
        working-directory: client
      - name: Start the server
        working-directory: server
        env:
          MONGO_URI: mongodb://127.0.0.1:27017/e2e
          SEED_DEMO: 'true'
          CLIENT_DIST: ../client/dist
          PORT: '3000'
        run: |
          nohup node dist/index.js > server.log 2>&1 &
          for i in $(seq 1 60); do curl -sf http://localhost:3000/api/ && exit 0; sleep 1; done
          cat server.log; exit 1
      - run: npm run test:e2e
        working-directory: client
      - if: failure()
        run: cat server/server.log
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-traces
          path: client/test-results
